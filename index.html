/* =========================================================
   RANDOM NUMBER GENERATOR
========================================================= */

function rng(seed) {

  let x = seed >>> 0;

  return function() {

    x += 0x6D2B79F5;

    let t = x;

    t = Math.imul(
      t ^ (t >>> 15),
      t | 1
    );

    t ^= t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (t ^ (t >>> 14)) >>> 0
    ) / 4294967296;
  };
}


function pick(array, random) {

  return array[
    Math.floor(random() * array.length)
  ];
}


function shuffle(array, random) {

  const copy = [...array];

  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(random() * (i + 1));

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
}


/* =========================================================
   MULTIPLE CHOICE HELPER
   GUARANTEES EXACTLY ONE CORRECT ANSWER
========================================================= */

function makeOptions(
  correct,
  wrongAnswers,
  random,
  count = 4
) {

  /*
     Remove anything that is identical to the correct answer.
  */

  const uniqueWrong = [
    ...new Set(
      wrongAnswers.filter(
        answer => String(answer) !== String(correct)
      )
    )
  ];

  const selectedWrong =
    shuffle(uniqueWrong, random)
      .slice(0, count - 1);

  const options = shuffle(
    [
      correct,
      ...selectedWrong
    ],
    random
  );

  return {
    options,
    answer: options.indexOf(correct)
  };
}


/* =========================================================
   CATEGORY QUESTION HELPER
========================================================= */

function categoryQuestion(
  category,
  correct,
  wrongPool,
  random
) {

  /*
     CRITICAL:
     wrongPool MUST contain things that are NOT
     members of the category being asked about.
  */

  const wrongAnswers = shuffle(
    wrongPool.filter(
      item => item !== correct
    ),
    random
  ).slice(0, 3);

  const options = shuffle(
    [
      correct,
      ...wrongAnswers
    ],
    random
  );

  return {
    q: `Which one is a ${category}?`,
    o: options,
    a: options.indexOf(correct)
  };
}


/* =========================================================
   QUESTION GENERATOR
========================================================= */

function generateQuestion(id) {

  const random = rng(
    id * 7919 + 1234567
  );

  const type = id % 30;


  /* =======================================================
     0 — ADDITION
  ======================================================= */

  if (type === 0) {

    const a =
      1 + Math.floor(random() * 50);

    const b =
      1 + Math.floor(random() * 50);

    const correct = a + b;

    const result = makeOptions(
      correct,
      [
        correct + 1,
        correct - 1,
        correct + 2,
        correct - 2,
        correct + 5,
        correct - 5
      ],
      random
    );

    return {
      q: `What is ${a} + ${b}?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     1 — SUBTRACTION
  ======================================================= */

  if (type === 1) {

    const a =
      20 + Math.floor(random() * 80);

    const b =
      1 + Math.floor(random() * a);

    const correct = a - b;

    const result = makeOptions(
      correct,
      [
        correct + 1,
        correct - 1,
        correct + 2,
        correct - 2,
        correct + 5,
        correct - 5
      ],
      random
    );

    return {
      q: `What is ${a} − ${b}?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     2 — MULTIPLICATION
  ======================================================= */

  if (type === 2) {

    const a =
      2 + Math.floor(random() * 12);

    const b =
      2 + Math.floor(random() * 12);

    const correct = a * b;

    const result = makeOptions(
      correct,
      [
        correct + a,
        correct - a,
        correct + b,
        correct - b,
        correct + 1,
        correct - 1
      ],
      random
    );

    return {
      q: `What is ${a} × ${b}?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     3 — DIVISION
  ======================================================= */

  if (type === 3) {

    const b =
      2 + Math.floor(random() * 10);

    const correct =
      2 + Math.floor(random() * 12);

    const a = b * correct;

    const result = makeOptions(
      correct,
      [
        correct + 1,
        correct - 1,
        correct + 2,
        correct - 2,
        correct + 5
      ],
      random
    );

    return {
      q: `What is ${a} ÷ ${b}?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     4 — DOUBLE
  ======================================================= */

  if (type === 4) {

    const n =
      2 + Math.floor(random() * 50);

    const correct = n * 2;

    const result = makeOptions(
      correct,
      [
        n,
        n * 3,
        n + 2,
        correct + 2,
        correct - 2
      ],
      random
    );

    return {
      q: `What is double ${n}?`,

  }


  /* =======================================================
     5 — HALF
  ======================================================= */

  if (type === 5) {

    const result = makeOptions(
      correct,
      [
        correct + 1,
        correct - 1,
        correct + 2,
        correct - 2,
        n
      ],
      random
    );

    return {
      q: `What is half of ${n}?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     6 — BIGGER NUMBER
  ======================================================= */

  if (type === 6) {

    const a =
      10 + Math.floor(random() * 90);

    const b =
      a + 1 + Math.floor(random() * 30);

    return {
      q: `Which number is bigger: ${a} or ${b}?`,
      o: [String(a), String(b)],
      a: 1
    };
  }


  /* =======================================================
     7 — SMALLER NUMBER
  ======================================================= */

  if (type === 7) {

    const a =
      10 + Math.floor(random() * 90);

    const b =
      a + 1 + Math.floor(random() * 30);

    return {
      q: `Which number is smaller: ${a} or ${b}?`,
      o: [String(a), String(b)],
      a: 0
    };
  }


  /* =======================================================
     8 — NUMBER PATTERN
  ======================================================= */

  if (type === 8) {

    const start =
      2 + Math.floor(random() * 20);

    const step =
      2 + Math.floor(random() * 9);

    const numbers = [
      start,
      start + step,
      start + step * 2,
      start + step * 3
    ];

    const correct =
      start + step * 4;

    const result = makeOptions(
      correct,
      [
        correct + step,
        correct - step,
        correct + 1,
        correct - 1
      ],
      random
    );

    return {
      q: `What comes next? ${numbers.join(", ")}, ?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     9 — ANIMAL
  ======================================================= */

  if (type === 9) {

    const correct =

    /*
       IMPORTANT:
       Foods, objects and shapes are NOT animals.
    */

    const wrongPool = [
      ...foods,
      ...objects,
      ...shapes
    ];

    return categoryQuestion(
      "animal",

      wrongPool,
      random
    );
  }


  /* =======================================================
     10 — FOOD
  ======================================================= */

  if (type === 10) {

    const correct =
      pick(foods, random);

    /*
       IMPORTANT:
       Animals, objects and shapes are NOT foods.
       So this can NEVER become:

       pizza
       banana
       orange
       hamburger

       when asking "Which one is a food?"
    */

    const wrongPool = [

    ];

    return categoryQuestion(

  }


  /* =======================================================
     11 — COUNTRY
  ======================================================= */

  if (type === 11) {

     12 — CAPITAL CITY

  if (type === 12) {

  /* =======================================================
     13 — VIDEO GAME
  ======================================================= */

  if (type === 13) {

    */

     14 — SHAPE
  ======================================================= */

  if (type === 14) {

    */

    const wrongPool = [

    ];

    );

  /* =======================================================
     15 — COLOR
  ======================================================= */

  if (type === 15) {

    const correct =
      pick(colors, random);

    /*
       CRITICAL FIX:

       The wrong answers are ONLY animals,
       objects and shapes.

       Therefore if the question is:

       "Which one is a color?"

       there will NEVER be:
       orange
       black
       blue

       all together.

       There is exactly ONE color.
    */

    const wrongPool = [

    ];

    return categoryQuestion(

      correct,
      wrongPool,

    );
  }


  /* =======================================================
     16 — LETTER COUNT
  ======================================================= */

  if (type === 16) {

    const words = [
      "apple",
      "banana",
      "computer",
      "Minecraft",
      "elephant",
      "pizza",
      "backpack",
      "triangle",

    const word =
      pick(words, random);

    const correct =
      word.length;

    const result = makeOptions(
      correct,
      [
        correct + 1,
        correct - 1,
        correct + 2,
        correct - 2,
        correct + 3
      ],
      random
    );

    return {
      q: `How many letters are in "${word}"?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     17 — FIRST LETTER
  ======================================================= */

  if (type === 17) {

    const word =
      pick(
        [
          "apple",
          "banana",
          "computer",
          "elephant",
          "pizza",
          "triangle",
          "robot",
          "Minecraft"
        ],
        random
      );

    const correct =
      word[0].toUpperCase();

    const letters =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        .split("")
        .filter(
          letter => letter !== correct
        );

    const result = makeOptions(
      correct,
      letters,
      random
    );

    return {
      q: `What is the first letter of "${word}"?`,
      o: result.options,
      a: result.answer
    };
  }


  /* =======================================================
     18 — LAST LETTER
  ======================================================= */

  if (type === 18) {

    const word =
      pick(
        [
          "apple",
          "banana",
          "computer",
          "elephant",
          "pizza",
          "triangle",
          "robot",
          "Minecraft"
        ],
        random
      );

    const correct =
      word[word.length - 1]
        .toUpperCase();

    const letters =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        .split("")
        .filter(
          letter => letter !== correct
        );

    const result = makeOptions(
      correct,
      letters,
      random
    );

    return {
      q: `What is the last letter of "${word}"?`,
      o: result.options,
      a: result.answer
    };
  }

  ======================================================= */

        .filter(

        );

      "ROBOT",
      "MOON",
      "TIGER",
      "PIZZA",
      "CLOUD",
      "STAR",
      "BANANA",
      "MINECRAFT",
      "RAINBOW"
    ];

    const word =
      pick(memoryWords, random);

    return {
      q: `Remember this word:`,
      o: ["I remember it", "Next"],
      a: 0,
      memory: word
    };
  }


  /* =======================================================
     25 — LOOK AROUND: COLOR
  ======================================================= */

  if (type === 25) {

    const color =
      pick(colors, random);

    return {
      q: `Look around you. Find something ${color}.`,
      o: [
        "I found it",
        "I don't see one"
      ],
      a: 0,
      look: true
    };
  }


  /* =======================================================
     26 — LOOK AROUND: OBJECT
  ======================================================= */

  if (type === 26) {

    const object =
      pick(objects, random);

    return {
      q: `Look around you. Can you find a ${object}?`,
      o: [
        "Yes",
        "Not right now"
      ],
      a: 0,
      look: true
    };
  }


  /* =======================================================
     27 — ROUNDING
  ======================================================= */

  if (type === 27) {

    const n =
      10 + Math.floor(random() * 90);

    const correct =
      Math.round(n / 10) * 10;

    const result = makeOptions(
      correct,
      [
        correct - 10,
        correct + 10,
        correct - 20,
        correct + 20
      ],
      random
    );

    return {
      q: `What is ${n} rounded to the nearest 10?`,
      o: result.options.map(String),
      a: result.answer
    };
  }


  /* =======================================================
     28 — EVEN OR ODD
  ======================================================= */

  if (type === 28) {

    const n =
      1 + Math.floor(random() * 100);

    const correct =
      n % 2 === 0
        ? "Even"
        : "Odd";

    return {
      q: `Is ${n} even or odd?`,
      o: ["Even", "Odd"],
      a: correct === "Even" ? 0 : 1
    };
  }


  /* =======================================================
     29 — BASIC KNOWLEDGE
  ======================================================= */

  const facts = [

    {
      q: "How many sides does a triangle have?",
      correct: "3",
      wrong: ["4", "5", "6"]
    },

    {
      q: "How many sides does a square have?",
      correct: "4",
      wrong: ["3", "5", "6"]
    },

    {
      q: "Which planet do we live on?",
      correct: "Earth",
      wrong: ["Mars", "Venus", "Jupiter"]
    },

    {
      q: "How many legs does a dog usually have?",
      correct: "4",
      wrong: ["2", "6", "8"]
    },

    {
      q: "What is 10 × 10?",
      correct: "100",
      wrong: ["10", "20", "1,000"]
    },

    {
      q: "How many days are in a week?",
      correct: "7",
      wrong: ["5", "6", "8"]
    },

    {
      q: "How many hours are in a day?",
      correct: "24",
      wrong: ["12", "18", "48"]
    },

    {
      q: "Which animal is known for having a long trunk?",
      correct: "Elephant",
      wrong: ["Tiger", "Penguin", "Rabbit"]
    },

    {
      q: "Which one is a fruit?",
      correct: "Apple",
      wrong: ["Chair", "Pencil", "Shoe"]
    },

    {
      q: "Which one is used for writing?",
      correct: "Pencil",
      wrong: ["Banana", "Pillow", "Spoon"]
    },

    {
      q: "Which one is normally used to tell time?",
      correct: "Clock",
      wrong: ["Chair", "Banana", "Pencil"]
    },

    {
      q: "Which one is normally used to sit on?",
      correct: "Chair",
      wrong: ["Apple", "Shark", "Triangle"]
    },

    {
      q: "Which one can fly?",
      correct: "Bird",
      wrong: ["Chair", "Table", "Pencil"]
    },

    {
      q: "Which one is normally found in the sky?",
      correct: "Cloud",
      wrong: ["Chair", "Spoon", "Shoe"]
    },

    {
      q: "Which one is a shape?",
      correct: "Triangle",
      wrong: ["Banana", "Dog", "Pencil"]
    }

  ];

  const fact =
    pick(facts, random);

  const options =
    shuffle(
      [
        fact.correct,
        ...fact.wrong
      ],
      random
    );

  return {
    q: fact.q,
    o: options,
    a: options.indexOf(fact.correct)
  };
}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(id) {

  const data =
    generateQuestion(id);

  const card =
    document.createElement("section");

  card.className = "card";

  const random =
    rng(id * 99991 + 42);

  const hue =
    Math.floor(random() * 360);

  card.style.background =
    `linear-gradient(
      145deg,
      hsl(${hue}, 65%, 18%),
      hsl(${(hue + 45) % 360}, 60%, 8%)
    )`;


  /* QUESTION */

  const question =
    document.createElement("div");

  question.className =
    "question";

  question.textContent =
    data.q;

  card.appendChild(question);


  /* MEMORY WORD */

  if (data.memory) {

    const memory =
      document.createElement("div");

    memory.className =
      "memoryWord";

    memory.textContent =
      data.memory;

    card.appendChild(memory);

    const note =
      document.createElement("div");

    note.className =
      "lookText";

    note.textContent =
      "Try to remember it.";

    card.appendChild(note);
  }


  /* ANSWERS */

  const answers =
    document.createElement("div");

  answers.className =
    "answers";


  data.o.forEach(
    (answer, index) => {

      const button =
        document.createElement("button");

      button.className =
        "answer";

      button.textContent =
        answer;


      button.addEventListener(
        "click",
        () => {

          /*
             Don't allow multiple answers.
          */

          if (
            card.dataset.answered === "true"
          ) {
            return;
          }

          card.dataset.answered =
            "true";


          const buttons =
            [...answers.children];


          buttons.forEach(
            btn => {
              btn.classList.add(
                "disabled"
              );
            }
          );


          const result =
            document.createElement("div");

          result.className =
            "result";


          /* LOOK-AROUND QUESTIONS */

          if (data.look) {

            if (index === data.a) {

              button.classList.add(
                "correct"
              );

              result.textContent =
                "Nice! 👍";

              streak++;

            }

          }


          /* NORMAL QUESTIONS */

          else {

            if (index === data.a) {

              button.classList.add(
                "correct"
              );

              result.textContent =
                "Correct! ✓";

              streak++;

            }

            else {

              button.classList.add(
                "wrong"
              );

              /*
                 Because data.a is calculated AFTER
                 shuffling the answers, this always
                 highlights the actual correct answer.
              */

              if (buttons[data.a]) {

                buttons[data.a]
                  .classList.add(
                    "correct"
                  );
              }

              result.textContent =
                "Not quite!";

              streak = 0;
            }
          }


          card.appendChild(result);
        }
      );


      answers.appendChild(button);
    }
  );


  card.appendChild(answers);

  return card;
}


/* =========================================================
   ENDLESS FEED
========================================================= */

let generated = 0;

let startId =
  Math.floor(
    Math.random() * TOTAL
  );


function loadBatch() {

  if (generated >= TOTAL) {
    return;
  }

  const fragment =
    document.createDocumentFragment();


  for (
    let i = 0;
    i < BATCH_SIZE &&
    generated < TOTAL;
    i++
  ) {

    const id =
      (startId + generated) %
      TOTAL;

    fragment.appendChild(
      createCard(id)
    );

    generated++;
  }


  feed.appendChild(fragment);

  cleanupCards();

  updateProgress();
}


/* =========================================================
   REMOVE OLD CARDS
========================================================= */

function cleanupCards() {

  while (
    feed.children.length >
    MAX_DOM_CARDS
  ) {

    const first =
      feed.firstElementChild;

    const height =
      first.offsetHeight;

    first.remove();

    /*
       Keep the user's position from
       jumping when old cards are removed.
    */

    feed.scrollTop -= height;
  }
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

  progressText.textContent =
    `${Math.min(
      generated,
      TOTAL
    ).toLocaleString()} / ${TOTAL.toLocaleString()}`;


  const percentage =
    Math.min(
      generated / TOTAL,
      1
    );


  progressThumb.style.top =
    `calc(${percentage * 100}% - 35px)`;
}


/* =========================================================
   LOAD MORE WHEN NEAR BOTTOM
========================================================= */

feed.addEventListener(
  "scroll",
  () => {

    const distanceFromBottom =
      feed.scrollHeight -
      feed.scrollTop -
      feed.clientHeight;


    if (
      distanceFromBottom <
      feed.clientHeight * 5
    ) {

      loadBatch();
    }


    updateProgress();
  }
);


/* =========================================================
   SAFETY NET
========================================================= */

setInterval(
  () => {

    const distanceFromBottom =
      feed.scrollHeight -
      feed.scrollTop -
      feed.clientHeight;


    if (
      distanceFromBottom <
      feed.clientHeight * 5
    ) {

      loadBatch();
    }

  },
  500
);


/* =========================================================
   START GAME
========================================================= */

let streak = 0;

loadBatch();
loadBatch();

</script>
