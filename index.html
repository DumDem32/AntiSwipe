<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipe Break">
<title>Swipe Break</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100%;
  overflow:hidden
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom)
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-weight:800
}

#feed{
  height:calc(100% - 58px);
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.card{
  height:100%;
  min-height:520px;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px
}

.inner{
  width:min(520px,100%);
  background:#171717;
  border:1px solid #2b2b2b;
  border-radius:28px;
  padding:30px 22px;
  text-align:center
}

.emoji{
  font-size:64px
}

.type{
  font-size:13px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:1.2px;
  margin-top:12px
}

.title{
  font-size:28px;
  font-weight:850;
  line-height:1.12;
  margin-top:10px
}

.hint{
  color:#aaa;
  margin:10px 0 18px;
  line-height:1.4
}

.options{
  display:grid;
  gap:10px
}

.option{
  width:100%;
  padding:14px;
  border-radius:15px;
  border:1px solid #333;
  background:#222;
  color:#fff;
  font-size:16px;
  font-weight:700
}

.option.selected{
  outline:2px solid #fff;
  background:#303030
}

.result{
  min-height:22px;
  margin-top:12px;
  font-weight:700
}

.counter{
  font-size:12px;
  color:#777;
  margin-top:4px
}

.swipe{
  position:fixed;
  bottom:12px;
  left:0;
  right:0;
  text-align:center;
  color:#777;
  font-size:12px;
  pointer-events:none
}
</style>
</head>

<body>

<header>
  <div>
    <div>Swipe Break</div>
  </div>

  <div id="streak">🔥 0</div>
</header>

<div id="feed"></div>

<div class="swipe">↑ swipe for another challenge</div>

<script>

// ==========================================
// SWIPE BREAK
// 1,000,000 deterministic challenges
// ==========================================

const TOTAL = 1000000;

// Random starting point every time the app opens.
// We then move through every challenge exactly once.
const startId = Math.floor(Math.random() * TOTAL);

let generated = 0;
let streak = 0;

// Keep track of challenges already shown this session
const seenChallenges = new Set();

const feed = document.getElementById("feed");
const streakEl = document.getElementById("streak");
const countEl = document.getElementById("count");


// ==========================================
// ESCAPE TEXT SAFELY
// ==========================================

const esc = s =>
  s.replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


// ==========================================
// DETERMINISTIC RANDOM GENERATOR
// ==========================================

const rng = seed => {
  let x = (seed + 0x6D2B79F5) >>> 0;

  return () => {
    x = Math.imul(x ^ x >>> 15, 1 | x);
    x ^= x + Math.imul(x ^ x >>> 7, 61 | x);

    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
};


const pick = (array, random) =>
  array[Math.floor(random() * array.length)];


const shuffle = (array, random) => {
  array = [...array];

  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
};


// ==========================================
// DATA
// ==========================================

const colors = [
  "red","blue","green","yellow","orange","purple",
  "black","white","pink","brown","gray","silver"
];

const animals = [
  "cat","dog","penguin","frog","turtle","rabbit",
  "panda","koala","lion","tiger","elephant","giraffe",
  "zebra","fox","wolf","bear","otter","dolphin",
  "octopus","shark"
];

const foods = [
  "pizza","burger","apple","banana","popcorn",
  "taco","cookie","donut","ice cream","watermelon",
  "pancake","sandwich","hot dog","strawberry","pretzel"
];

const countries = [
  "Canada","Brazil","Japan","Italy","France","Mexico",
  "Australia","India","Egypt","Greece","Spain","Germany",
  "Norway","Kenya","Chile","Peru","China","South Korea",
  "Ireland","New Zealand"
];

const games = [
  "Minecraft","Roblox","Fortnite","Terraria","Mario Kart",
  "Rocket League","Pokémon","Among Us","Super Mario Bros.",
  "The Legend of Zelda","Geometry Dash","Fall Guys"
];

const emojis = [
  "🍎","🐸","⭐","🚗","🍕","🎮","🦖","🚀",
  "🌎","⚡","🎈","🍪","🐙","🏀","🎲"
];

const words = [
  "APPLE","ROBOT","GAMER","PLANET","CASTLE","BANANA",
  "TIGER","PUZZLE","COMPUTER","DRAGON","MANGO","ROCKET"
];


// ==========================================
// QUESTION GENERATOR
// ==========================================

function question(id){

  const r = rng(id);
  const type = id % 12;


  // ========================================
  // MATH
  // ========================================

  if(type === 0){

    const n = 2 + Math.floor(r() * 48);
    const mult = 2 + Math.floor(r() * 9);

    const ans = n * mult;

    const opts = shuffle([
      ans,
      ans + mult,
      ans - mult,
      ans + 2 * mult
    ], r);

    const questions = [
      `What is ${n} × ${mult}?`,
      `Solve: ${n} × ${mult}`,
      `Calculate ${n} times ${mult}.`,
      `Can you solve ${n} × ${mult}?`,
      `What's the answer to ${n} × ${mult}?`,
      `Quick math: ${n} × ${mult} = ?`,
      `Work this out: ${n} × ${mult}`,
      `Figure out ${n} × ${mult}.`,
      `What does ${n} multiplied by ${mult} equal?`,
      `Solve this multiplication problem: ${n} × ${mult}`
    ];

    return {
      e:"🔢",
      t:"Fast Math",
      q:pick(questions, r),
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // ========================================
  // ADDITION
  // ========================================

  if(type === 1){

    const n = 5 + Math.floor(r() * 95);
    const add = 5 + Math.floor(r() * 95);

    const ans = n + add;

    const opts = shuffle([
      ans,
      ans + 1,
      ans - 1,
      ans + 10
    ], r);

    const questions = [
      `What is ${n} + ${add}?`,
      `Solve: ${n} + ${add}`,
      `Calculate ${n} plus ${add}.`,
      `Can you solve ${n} + ${add}?`,
      `What's the answer to ${n} + ${add}?`,
      `Quick math: ${n} + ${add} = ?`,
      `Work this out: ${n} + ${add}`,
      `Figure out ${n} + ${add}.`,
      `What does ${n} plus ${add} equal?`,
      `Solve this addition problem: ${n} + ${add}`
    ];

    return {
      e:"➕",
      t:"Number Puzzle",
      q:pick(questions, r),
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // ========================================
  // SUBTRACTION
  // ========================================

  if(type === 2){

    const n = 20 + Math.floor(r() * 80);
    const sub = 2 + Math.floor(r() * 18);

    const ans = n - sub;

    const opts = shuffle([
      ans,
      ans + sub,
      ans - 1,
      ans + 10
    ], r);

    const questions = [
      `What is ${n} − ${sub}?`,
      `Solve: ${n} − ${sub}`,
      `Calculate ${n} minus ${sub}.`,
      `Can you solve ${n} − ${sub}?`,
      `What's the answer to ${n} − ${sub}?`,
      `Quick math: ${n} − ${sub} = ?`,
      `Work this out: ${n} − ${sub}`,
      `Figure out ${n} − ${sub}.`,
      `What does ${n} minus ${sub} equal?`,
      `Solve this subtraction problem: ${n} − ${sub}`
    ];

    return {
      e:"➖",
      t:"Number Puzzle",
      q:pick(questions, r),
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // ========================================
  // MULTIPLICATION
  // ========================================

  if(type === 3){

    const a = 2 + Math.floor(r() * 20);
    const b = 2 + Math.floor(r() * 20);

    const ans = a * b;

    const opts = shuffle([
      ans,
      ans + a,
      ans - b,
      ans + 10
    ], r);

    const questions = [
      `What is ${a} × ${b}?`,
      `Solve: ${a} × ${b}`,
      `Calculate ${a} times ${b}.`,
      `Can you solve ${a} × ${b}?`,
      `What's the answer to ${a} × ${b}?`,
      `Quick math: ${a} × ${b} = ?`,
      `Work this out: ${a} × ${b}`,
      `Figure out ${a} × ${b}.`,
      `What does ${a} multiplied by ${b} equal?`,
      `Solve this multiplication problem: ${a} × ${b}`
    ];

    return {
      e:"✖️",
      t:"Math",
      q:pick(questions, r),
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // ========================================
  // LOOK AROUND
  // ========================================

  if(type === 4){

    const color = pick(colors, r);

    const opts = shuffle([
      color,
      "something else",
      "nothing",
      "two colors"
    ], r);

    const questions = [
      `Look around you. Can you find something ${color}?`,
      `Find something ${color} around you.`,
      `Can you spot something ${color}?`,
      `Look around. Is there anything ${color} nearby?`,
      `Find a ${color} object around you.`,
      `Take a look around. Can you see something ${color}?`,
      `Spot something ${color} near you.`,
      `Look around your surroundings. Can you find ${color}?`,
      `Can you see anything ${color} right now?`,
      `Find something that is ${color}.`,
      `Look around you for something ${color}.`,
      `Is there a ${color} object you can see?`,
      `Scan the area around you. Can you spot ${color}?`,
      `Look nearby. Can you find something ${color}?`,
      `Find a ${color} thing in your surroundings.`
    ];

    return {
      e:"👀",
      t:"Look Around",
      q:pick(questions, r),
      o:opts,
      a:null
    };
  }


  // ========================================
  // ANIMALS
  // ========================================

  if(type === 5){

    const animal = pick(animals, r);

    const others = shuffle(
      animals.filter(x => x !== animal),
      r
    ).slice(0,3);

    const opts = shuffle(
      [animal, ...others],
      r
    );

    const questions = [
      "Which of these is an animal?",
      "Pick the animal.",
      "Which choice is an animal?",
      "Find the animal in this list.",
      "Which one is a real animal?",
      "Choose the animal.",
      "Spot the animal.",
      "Which of these creatures is an animal?",
      "Can you identify the animal?",
      "Which answer is an animal?",
      "Select the animal.",
      "Which creature belongs in the animal category?",
      "Find the animal.",
      "Which option is a living animal?",
      "Which one is an actual animal?"
    ];

    return {
      e:"🐾",
      t:"Animals",
      q:pick(questions, r),
      o:opts,
      a:opts.indexOf(animal)
    };
  }


  // ========================================
  // FOOD
  // ========================================

  if(type === 6){

    const food = pick(foods, r);

    const others = shuffle(
      foods.filter(x => x !== food),
      r
    ).slice(0,3);

    const opts = shuffle(
      [food, ...others],
      r
    );

    const questions = [
      "Which one is food?",
      "Pick the food.",
      "Which choice is something you can eat?",
      "Find the food in this list.",
      "Which one is edible?",
      "Choose the food.",
      "Spot the food.",
      "Which of these can you eat?",
      "Can you identify the food?",
      "Which answer is a food?",
      "Select the food.",
      "Which option belongs in the food category?",
      "Find something you could eat.",
      "Which one is an actual food?",
      "Which choice would you find on a menu?"
    ];

    return {
      e:"🍿",
      t:"Food",
      q:pick(questions, r),
      o:opts,
      a:opts.indexOf(food)
    };
  }


  // ========================================
  // GEOGRAPHY
  // ========================================

  if(type === 7){

    const country = pick(countries, r);

    const opts = shuffle([
      country,
      ...shuffle(
        countries.filter(x => x !== country),
        r
      ).slice(0,3)
    ], r);

    const questions = [
      "Which of these is a country?",
      "Pick the country.",
      "Which choice names a country?",
      "Find the country in this list.",
      "Which answer is a real country?",
      "Choose the country.",
      "Which one is a country?",
      "Spot the country.",
      "Which option belongs on a world map?",
      "Which place is a country?",
      "Can you identify the country?",
      "Which of these places is a country?",
      "Select the country.",
      "Which answer represents a country?",
      "Find the country."
    ];

    return {
      e:"🌎",
      t:"Geography",
      q:pick(questions, r),
      o:opts,
      a:opts.indexOf(country)
    };
  }


  // ========================================
  // GAMING
  // ========================================

  if(type === 8){

    const game = pick(games, r);

    const opts = shuffle([
      game,
      ...shuffle(
        games.filter(x => x !== game),
        r
      ).slice(0,3)
    ], r);

    const questions = [
      "Which of these is a video game?",
      "Pick the video game.",
      "Which choice is a real game?",
      "Find the game in this list.",
      "Which one is a video game?",
      "Choose the game.",
      "Spot the video game.",
      "Which of these games is real?",
      "Can you identify the video game?",
      "Which answer is a game?",
      "Select the video game.",
      "Which option is an actual game?",
      "Find the game.",
      "Which one belongs in the gaming category?",
      "Which choice is something you can play?"
    ];

    return {
      e:"🎮",
      t:"Gaming",
      q:pick(questions, r),
      o:opts,
      a:opts.indexOf(game)
    };
  }


  // ========================================
  // MEMORY
  // ========================================

  if(type === 9){

    const seq = [
      pick(emojis,r),
      pick(emojis,r),
      pick(emojis,r)
    ];

    const target = seq[1];

    const wrong = emojis.filter(x => x !== target);

    const opts = shuffle([
      target,
      pick(wrong,r),
      pick(wrong,r),
      pick(wrong,r)
    ], r);

    const questions = [
      `Remember: ${seq.join(" ")}. Which emoji was second?`,
      `Look closely: ${seq.join(" ")}. What was the middle emoji?`,
      `Memorize ${seq.join(" ")}. Which appeared second?`,
      `Remember this sequence: ${seq.join(" ")}. Pick the second emoji.`,
      `Which emoji was in the middle? ${seq.join(" ")}`,
      `Study this: ${seq.join(" ")}. What was the second emoji?`,
      `Which emoji came second? ${seq.join(" ")}`,
      `Remember the order: ${seq.join(" ")}. Choose the middle one.`,
      `What was the second emoji in ${seq.join(" ")}?`,
      `Can you remember ${seq.join(" ")}? Pick the second one.`
    ];

    return {
      e:"🧠",
      t:"Memory",
      q:pick(questions, r),
      o:opts,
      a:opts.indexOf(target)
    };
  }


  // ========================================
  // WORD PUZZLE
  // ========================================

  if(type === 10){

    const word = pick(words, r);

    const scrambled = shuffle([...word], r).join("");

    const wrong = words.filter(x => x !== word);

    const opts = shuffle([
      word,
      pick(wrong,r),
      pick(wrong,r),
      pick(wrong,r)
    ], r);

    const questions = [
      `Unscramble: ${scrambled}`,
      `Can you unscramble ${scrambled}?`,
      `What word does ${scrambled} make?`,
      `Solve this scrambled word: ${scrambled}`,
      `Figure out the word: ${scrambled}`,
      `Which answer matches ${scrambled}?`,
      `Decode this word: ${scrambled}`,
      `Put these letters in order: ${scrambled}`,
      `What word is hidden in ${scrambled}?`,
      `Can you solve ${scrambled}?`,
      `Identify the scrambled word: ${scrambled}`,
      `Which word can be made from ${scrambled}?`
    ];

    return {
      e:"🔤",
      t:"Word Puzzle",
      q:pick(questions, r),
      o:opts,
      a:opts.indexOf(word)
    };
  }


  // ========================================
  // RANDOM NUMBER
  // ========================================

  const target = 1 + Math.floor(r() * 10);

  const opts = shuffle([
    String(target),
    String((target % 10) + 1),
    String(Math.max(1,target - 1)),
    String(((target + 4) % 10) + 1)
  ], r);

  const questions = [
    "Pick a number from 1–10. Which number did the app choose?",
    "Can you guess the secret number?",
    "Which number is the app thinking of?",
    "What number did the app secretly pick?",
    "Try to predict the app's number.",
    "Which number was randomly selected?",
    "Guess the hidden number from 1–10.",
    "What number is hiding behind this challenge?",
    "Can you predict the random number?",
    "Which number did the app choose this time?",
    "Take a guess. What number was picked?",
    "Which number is the secret choice?",
    "Guess what number the app selected.",
    "What number did the randomizer pick?",
    "Can you figure out the app's number?"
  ];

  return {
    e:"🎲",
    t:"Prediction",
    q:pick(questions, r),
    o:opts,
    a:opts.indexOf(String(target))
  };
}


// ==========================================
// CREATE A CARD
// ==========================================

function makeCard(id){

  const d = question(id);

  // Create a unique fingerprint for this challenge
  const fingerprint =
    d.t + "|" +
    d.q + "|" +
    d.o.join("|");

  // Skip if this exact challenge was already shown
  if(seenChallenges.has(fingerprint)){
    return false;
  }

  seenChallenges.add(fingerprint);

  const card = document.createElement("section");
  card.className = "card";

  const inner = document.createElement("div");
  inner.className = "inner";

  inner.innerHTML = `
    <div class="emoji">${d.e}</div>
    <div class="type">${d.t}</div>
    <div class="title">${esc(d.q)}</div>
    <div class="hint">Pick an answer.</div>
    <div class="options"></div>
    <div class="result"></div>
  `;

  const opts = inner.querySelector(".options");
  const result = inner.querySelector(".result");


  d.o.forEach((x,i) => {

    const b = document.createElement("button");

    b.className = "option";
    b.textContent = x;

    b.onclick = () => {

      [...opts.children].forEach(v =>
        v.classList.remove("selected")
      );

      b.classList.add("selected");


      if(d.a === null || i === d.a){

        result.textContent =
          d.a === null
            ? "Nice choice 😎"
            : "✅ Correct!";

        streak++;

        streakEl.textContent = "🔥 " + streak;

      }else{

        result.textContent =
          "❌ Not quite — keep going!";

      }
    };

    opts.appendChild(b);
  });


  card.appendChild(inner);
  feed.appendChild(card);

  return true;
}


// ==========================================
// LOAD MORE CHALLENGES
// ==========================================

function addBatch(){

  const BATCH_SIZE = 1000;
  let added = 0;

  while(
    added < BATCH_SIZE &&
    generated < TOTAL
  ){

    // Wrap around so a random starting point
    // can still visit all 1,000,000 challenges.
    const id = (startId + generated) % TOTAL;

    const wasAdded = makeCard(id);

    generated++;

    // Only count the challenge if it wasn't a duplicate
    if(wasAdded){
      added++;
    }
  }
}


// ==========================================
// INITIAL LOAD
// ==========================================

addBatch();


// ==========================================
// CONTINUOUS SCROLLING + CARD CLEANUP
// ==========================================

feed.addEventListener(
  "scroll",
  () => {

    // Load more when the user gets near the bottom
    const nearBottom =
      feed.scrollTop + feed.clientHeight >=
      feed.scrollHeight - (feed.clientHeight * 5);

    if(nearBottom && generated < TOTAL){
      addBatch();
    }


    // Quietly remove cards far behind the user.
    // Keep the most recent 100 cards in the DOM.
    const cards = feed.children;

    while(
      cards.length > 100 &&
      cards[0].getBoundingClientRect().bottom < -2000
    ){
      cards[0].remove();
    }

  },
  {passive:true}
);


// ==========================================
// EXTRA SAFETY NET
// ==========================================

window.addEventListener("resize", () => {

  if(
    feed.scrollHeight <=
    feed.clientHeight * 3 &&
    generated < TOTAL
  ){
    addBatch();
  }

});

</script>

</body>
</html>
