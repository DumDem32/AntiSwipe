<script>

/* =========================================================
   SWIPE BREAK
   =========================================================

   1,000,000 UNIQUE CHALLENGE IDS

   The challenge number is randomly selected when the
   session starts.

   Every ID produces its own deterministic challenge.

   ========================================================= */


const TOTAL = 1000000;

const BATCH_SIZE = 1000;

const MAX_DOM_CARDS = 100;


/* RANDOM START */

const startId =
  Math.floor(Math.random() * TOTAL);


let generated = 0;

let streak = 0;


/* Prevent exact duplicates during a session */

const seenChallenges = new Set();


const feed =
  document.getElementById("feed");

const streakEl =
  document.getElementById("streak");

const progressThumb =
  document.getElementById("progressThumb");

const progressText =
  document.getElementById("progressText");


/* =========================================================
   RANDOM NUMBER GENERATOR
   ========================================================= */

function rng(seed){

  let x =
    (seed + 0x6D2B79F5) >>> 0;

  return function(){

    x =
      Math.imul(
        x ^ (x >>> 15),
        1 | x
      );

    x ^=
      x +
      Math.imul(
        x ^ (x >>> 7),
        61 | x
      );

    return (
      (x ^ (x >>> 14)) >>> 0
    ) / 4294967296;

  };

}


/* =========================================================
   HELPERS
   ========================================================= */

function pick(arr,r){

  return arr[
    Math.floor(r() * arr.length)
  ];

}


function shuffle(arr,r){

  const a = [...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(r() * (i+1));

    [
      a[i],
      a[j]
    ] =
    [
      a[j],
      a[i]
    ];

  }

  return a;

}


function uniqueWrongNumbers(
  answer,
  count,
  spread,
  r
){

  const values = new Set();

  while(values.size < count){

    let n =
      answer +
      Math.floor(
        (r() * 2 - 1) *
        spread
      );

    n = Math.max(0,n);

    if(n !== answer){
      values.add(n);
    }

  }

  return [...values];

}


function esc(s){

  return String(s).replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


/* =========================================================

const colors = [

  "Pikmin","Kirby","Celeste","Hollow Knight","Rayman",

const emojis = [
  "🍎","🐸","⭐","🚗","🍕","🎮","🦖","🚀",
  "🌎","⚡","🎈","🍪","🐙","🏀","🎲","🌈",
  "🔥","❄️","🐱","🐶","🍔","🌙","☀️","🎵",
  "🎯","🧩","🚲","🏆","🎨","🛸","🌟","🍩",
  "🦄","🐼","🍉","🚁","🎸","📚","💎","🌋"
];

const words = [
  "APPLE","ROBOT","GAMER","PLANET","CASTLE","BANANA",
  "TIGER","PUZZLE","COMPUTER","DRAGON","MANGO","ROCKET",
  "PIXEL","MONKEY","ORANGE","BASKET","PENCIL","WINDOW",
  "THUNDER","GALAXY","JUNGLE","MACHINE","RAINBOW","SPIDER",
  "COOKIE","TURTLE","CAMERA","MYSTERY","GUITAR",
  "CASTLE","OCEAN","FOREST","PLANET","ROBOT","LIGHT",
  "BRIDGE","SCHOOL","MUSIC","SUMMER","WINTER","FLOWER"
];

const shapes = [

  "rectangle","oval","hexagon","heart","arrow",
  "pentagon","octagon"
];

const directions = [

];

const seasons = [

];

const objects = [
  "book","chair","table","phone","computer",
  "lamp","door","window","backpack","pencil",
  "shoe","shirt","bottle","cup","toy","clock",
  "remote","keyboard","mouse","headphones",
  "box","picture","plant","blanket","pillow"
];


/* =========================================================
   UNIQUE QUESTION GENERATOR
   ========================================================= */

function question(id){

  const r = rng(id);

  /*
    Using id combinations here means there are far more
    possible questions than the 1,000,000 IDs.
  */

  const type =
    id % 24;


  /* =======================================================
     MULTIPLICATION
     ======================================================= */

  if(type === 0){

    const a =
      2 + Math.floor(r()*98);

    const b =
      2 + Math.floor(r()*48);

    const answer =
      a*b;

    const wrong =
      uniqueWrongNumbers(
        answer,
        3,
        Math.max(10,Math.floor(answer*.15)),
        r
      );

    const options =
      shuffle(
        [answer,...wrong],
        r
      );

    const templates = [
      `What is ${a} × ${b}?`,
      `Solve ${a} × ${b}.`,
      `Calculate ${a} times ${b}.`,
      `Quick math: ${a} × ${b} = ?`,
      `What does ${a} multiplied by ${b} equal?`,
      `Work out ${a} × ${b}.`,
      `Find the product of ${a} and ${b}.`,
      `Multiply ${a} by ${b}.`,
      `Can you solve ${a} × ${b}?`,
      `What is the product of ${a} and ${b}?`
    ];

    return {
      e:"🔢",
      t:"Fast Math",
      q:pick(templates,r),
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     ADDITION
     ======================================================= */

  if(type === 1){

    const a =
      1 + Math.floor(r()*99999);

    const b =
      1 + Math.floor(r()*99999);

    const answer =
      a+b;

    const wrong =
      uniqueWrongNumbers(
        answer,
        3,
        100,
        r
      );

    const options =
      shuffle(
        [answer,...wrong],
        r
      );

    const templates = [
      `What is ${a} + ${b}?`,
      `Solve: ${a} + ${b}`,
      `Calculate ${a} plus ${b}.`,
      `Add ${a} and ${b}.`,
      `What is the total of ${a} and ${b}?`,
      `Find the sum of ${a} and ${b}.`,
      `Quick addition: ${a} + ${b} = ?`,
      `Work out ${a} plus ${b}.`,
      `What do you get when you add ${a} and ${b}?`
    ];

    return {
      e:"➕",
      t:"Addition",
      q:pick(templates,r),
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     SUBTRACTION
     ======================================================= */

  if(type === 2){

    const a =
      100 +
      Math.floor(r()*99900);

    const b =
      1 +
      Math.floor(r()*(a-1));

    const answer =
      a-b;

    const wrong =
      uniqueWrongNumbers(
        answer,
        3,
        100,
        r
      );

    const options =
      shuffle(
        [answer,...wrong],
        r
      );

    const templates = [
      `What is ${a} − ${b}?`,
      `Solve: ${a} − ${b}`,
      `Calculate ${a} minus ${b}.`,
      `Subtract ${b} from ${a}.`,
      `Find the difference between ${a} and ${b}.`,
      `What remains after taking ${b} from ${a}?`,
      `Quick subtraction: ${a} − ${b} = ?`,
      `Work out ${a} minus ${b}.`
    ];

    return {
      e:"➖",
      t:"Subtraction",
      q:pick(templates,r),
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     LOOK AROUND
     ======================================================= */

  if(type === 3){

    const color =
      pick(colors,r);

    const object =
      pick(objects,r);

    const templates = [
      `Can you find something ${color}?`,
      `Can you spot something ${color}?`,
      `Do you see anything ${color}?`,
      `Look around for something ${color}.`,
      `Find a ${color} object nearby.`,
      `Try to spot a ${color} ${object}.`,
      `Look carefully. Can you see something ${color}?`,
      `Search your surroundings for something ${color}.`,
      `Is there a ${color} ${object} nearby?`,
      `What ${color} object can you spot?`,
      `Take a look around and find something ${color}.`,
      `Can you identify something ${color} in your view?`,
      `Spot a ${color} ${object}.`,
      `Look nearby and find a ${color} thing.`,
      `Find something that has the color ${color}.`,
      `Can you see a ${color} object without moving?`
    ];

    return {
      e:"👀",
      t:"Look Around",
      q:pick(templates,r),
      o:shuffle([
        "I found one",
        "I don't see one",
        "I see something similar",
        "I'm not sure"
      ],r),
      a:null
    };

  }


  /* =======================================================
     ANIMALS
     ======================================================= */

  if(type === 4){

    const answer =
      pick(animals,r);

    const options =
      shuffle([
        answer,
        ...animals
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    const templates = [
      "Which one is an animal?",
      "Which choice is a living creature?",
      "Find the animal.",
      "Can you identify the animal?",
      "Which option belongs to the animal world?",
      "Pick the real animal.",
      "Which answer names an animal?",
      "Spot the animal.",
      "Which one is a creature?",
      "Choose the animal from these choices."
    ];

    return {
      e:"🐾",
      t:"Animals",
      q:pick(templates,r),
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     FOOD
     ======================================================= */

  if(type === 5){

    const answer =
      pick(foods,r);

    const options =
      shuffle([
        answer,
        ...foods
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    const templates = [
      "Which one is food?",
      "Which choice can you eat?",
      "Find the edible item.",
      "Which one belongs in the food category?",
      "Can you identify the food?",
      "Pick something you could eat.",
      "Which option is something people eat?",
      "Spot the food.",
      "Which answer names a food?",
      "Which choice could appear on a menu?"
    ];

    return {
      e:"🍿",
      t:"Food",
      q:pick(templates,r),
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     GEOGRAPHY
     ======================================================= */

  if(type === 6){

    const answer =
      pick(countries,r);

    const options =
      shuffle([
        answer,
        ...countries
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    const templates = [
      "Which of these is a country?",
      "Which choice names a country?",
      "Find the country.",
      "Which place is a nation?",
      "Can you identify the country?",
      "Which option belongs on a world map as a country?",
      "Pick the country from these choices.",
      "Which answer represents a country?",
      "Spot the country.",
      "Which one is a nation?"
    ];

    return {
      e:"🌎",
      t:"Geography",
      q:pick(templates,r),
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     GAMING
     ======================================================= */

  if(type === 7){

    const answer =
      pick(games,r);

    const options =
      shuffle([
        answer,
        ...games
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    const templates = [
      "Which of these is a video game?",
      "Pick the video game.",
      "Which choice is a real game?",
      "Find the game.",
      "Which one can you play?",
      "Can you identify the game?",
      "Which option belongs in gaming?",
      "Spot the game title.",
      "Which answer names a video game?",
      "Choose the playable game."
    ];

    return {
      e:"🎮",
      t:"Gaming",
      q:pick(templates,r),
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     MEMORY
     ======================================================= */

  if(type === 8){

    const length =
      4 + Math.floor(r()*5);

    const sequence = [];

    for(
      let i=0;
      i<length;
      i++
    ){

      sequence.push(
        pick(emojis,r)
      );

    }

    const index =
      Math.floor(r()*length);

    const answer =
      sequence[index];

    const options =
      shuffle([
        answer,
        ...emojis
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:"🧠",
      t:"Memory",
      q:
        `Remember ${sequence.join(" ")}. ` +
        `Which emoji was #${index+1}?`,
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     WORD SCRAMBLE
     ======================================================= */

  if(type === 9){

    const word =
      pick(words,r);

    const letters =
      [...word];

    let scrambled =
      shuffle(letters,r).join("");

    if(scrambled === word){

      scrambled =
        letters.reverse().join("");

    }

    const options =
      shuffle([
        word,
        ...words
          .filter(x=>x!==word)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    const templates = [
      `Unscramble: ${scrambled}`,
      `What word does ${scrambled} make?`,
      `Can you decode ${scrambled}?`,
      `Solve this scrambled word: ${scrambled}`,
      `Rearrange these letters: ${scrambled}`,
      `Which word matches ${scrambled}?`,
      `What word is hidden in ${scrambled}?`,
      `Figure out ${scrambled}.`
    ];

    return {
      e:"🔤",
      t:"Word Puzzle",
      q:pick(templates,r),
      o:options,
      a:options.indexOf(word)
    };

  }


  /* =======================================================
     RANDOM NUMBER
     ======================================================= */

  if(type === 10){

    const max =
      10 + Math.floor(r()*99990);

    const answer =
      1 + Math.floor(r()*max);

    const values = new Set();

    values.add(answer);

    while(values.size < 4){

      values.add(
        1 +
        Math.floor(r()*max)
      );

    }

    const options =
      shuffle(
        [...values].map(String),
        r
      );

    return {
      e:"🎲",
      t:"Random Number",
      q:
        `Guess the secret number from 1–${max}.`,
      o:options,
      a:options.indexOf(String(answer))
    };

  }


  /* =======================================================
     NUMBER PATTERN
     ======================================================= */

  if(type === 11){

    const start =
      2 + Math.floor(r()*500);

    const step =
      1 + Math.floor(r()*100);

    const answer =
      start + step*4;

    const sequence = [
      start,
      start+step,
      start+step*2,
      start+step*3
    ];

    const options =
      shuffle([
        answer,
        answer+step,
        answer-step,
        answer+step*2
      ],r);

    return {
      e:"🔢",
      t:"Number Pattern",
      q:
        `${sequence.join(", ")}, ?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     ODD ONE OUT
     ======================================================= */

  if(type === 12){

    const a =
      pick(animals,r);

    const b =
      pick(
        animals.filter(x=>x!==a),
        r
      );

    const c =
      pick(animals.filter(
        x=>x!==a && x!==b
      ),r);

    const food =
      pick(foods,r);

    const options =
      shuffle([
        a,
        b,
        c,
        food
      ],r);

    return {
      e:"🕵️",
      t:"Odd One Out",
      q:
        "Which choice does NOT belong with the others?",
      o:options,
      a:options.indexOf(food)
    };

  }


  /* =======================================================
     SHAPES
     ======================================================= */

  if(type === 13){

    const answer =
      pick(shapes,r);

    const options =
      shuffle([
        answer,
        ...shapes
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:"🔷",
      t:"Shapes",
      q:
        pick([
          "Which of these is a shape?",
          "Pick the geometric shape.",
          "Which option is a shape?",
          "Find the shape.",
          "Which choice names a shape?",
          "Spot the shape."
        ],r),
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     LETTER COUNT
     ======================================================= */

  if(type === 14){

    const word =
      pick(words,r);

    const answer =
      word.length;

    const options =
      shuffle([
        answer,
        answer+1,
        Math.max(1,answer-1),
        answer+2
      ],r);

    return {
      e:"🔤",
      t:"Letter Count",
      q:
        `How many letters are in "${word}"?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     ESTIMATION
     ======================================================= */

  if(type === 15){

    const a =
      10 + Math.floor(r()*990);

    const b =
      10 + Math.floor(r()*990);

    const actual =
      a+b;

    const answer =
      Math.round(actual/10)*10;

    const options =
      shuffle([
        answer,
        answer+10,
        Math.max(10,answer-10),
        answer+20
      ],r);

    return {
      e:"🎯",
      t:"Estimation",
      q:
        `About how much is ${a} + ${b}?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     WHICH COMES NEXT
     ======================================================= */

  if(type === 16){

    const start =
      1 + Math.floor(r()*100);

    const step =
      1 + Math.floor(r()*50);

    const answer =
      start + step*4;

    const sequence = [
      start,
      start+step,
      start+step*2,
      start+step*3
    ];

    const options =
      shuffle([
        answer,
        answer+step,
        answer-step,
        answer+2
      ],r);

    return {
      e:"➡️",
      t:"What's Next?",
      q:
        `${sequence.join(" → ")} → ?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     EMOJI MEANING
     ======================================================= */

  if(type === 17){

    const meanings = [
      ["🔥","fire"],
      ["⭐","star"],
      ["🍎","apple"],
      ["🐶","dog"],
      ["🐱","cat"],
      ["🚗","car"],
      ["🚀","rocket"],
      ["🍕","pizza"],
      ["🏀","basketball"],
      ["🌎","Earth"],
      ["🎮","video game"],
      ["🎨","art"],
      ["🎲","dice"],
      ["🦖","dinosaur"],
      ["🌈","rainbow"],
      ["☀️","sun"],
      ["🌙","moon"],
      ["🐼","panda"],
      ["🍉","watermelon"],
      ["🎸","guitar"]
    ];

    const chosen =
      pick(meanings,r);

    const meaningsOnly =
      meanings.map(x=>x[1]);

    const options =
      shuffle([
        chosen[1],
        ...meaningsOnly
          .filter(x=>x!==chosen[1])
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:chosen[0],
      t:"Emoji",
      q:
        `What does ${chosen[0]} represent?`,
      o:options,
      a:options.indexOf(chosen[1])
    };

  }


  /* =======================================================
     COLORS
     ======================================================= */

  if(type === 18){

    const answer =
      pick(colors,r);

    const options =
      shuffle([
        answer,
        ...colors
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:"🎨",
      t:"Colors",
      q:
        "Which option is a color?",
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     DIRECTIONS
     ======================================================= */

  if(type === 19){

    const answer =
      pick(directions,r);

    const options =
      shuffle(
        directions,
        r
      );

    return {
      e:"🧭",
      t:"Directions",
      q:
        `Which direction is "${answer}"?`,
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     SEASONS
     ======================================================= */

  if(type === 20){

    const answer =
      pick(seasons,r);

    const options =
      shuffle(
        seasons,
        r
      );

    return {
      e:"🌤️",
      t:"Seasons",
      q:
        "Which of these is a season?",
      o:options,
      a:options.indexOf(answer)
    };

  }


  /* =======================================================
     BIGGER NUMBER
     ======================================================= */

  if(type === 21){

    let a =
      1 + Math.floor(r()*100000);

    let b =
      1 + Math.floor(r()*100000);

    while(a === b){
      b =
        1 + Math.floor(r()*100000);
    }

    const answer =
      Math.max(a,b);

    const options =
      shuffle([
        String(a),
        String(b),
        String(answer+1),
        String(Math.max(1,answer-1))
      ],r);

    return {
      e:"📊",
      t:"Compare",
      q:
        `Which number is larger: ${a} or ${b}?`,
      o:options,
      a:options.indexOf(String(answer))
    };

  }


  /* =======================================================
     SMALLER NUMBER
     ======================================================= */

  if(type === 22){

    let a =
      1 + Math.floor(r()*100000);

    let b =
      1 + Math.floor(r()*100000);

    while(a === b){
      b =
        1 + Math.floor(r()*100000);
    }

    const answer =
      Math.min(a,b);

    const options =
      shuffle([
        String(a),
        String(b),
        String(answer-1 > 0 ? answer-1 : answer+2),
        String(Math.max(a,b)+1)
      ],r);

    return {
      e:"📉",
      t:"Compare",
      q:
        `Which number is smaller: ${a} or ${b}?`,
      o:options,
      a:options.indexOf(String(answer))
    };

  }


  /* =======================================================
     QUICK CHOICE
     ======================================================= */

  const choices = [
    "sun","moon","star","cloud","tree","river",
    "mountain","ocean","robot","castle","rocket",
    "island","bridge","train","airplane","computer",
    "camera","guitar","book","pencil","planet",
    "volcano","rainbow","forest","desert","spaceship",
    "dinosaur","castle","trophy","keyboard"
  ];

  const answer =
    pick(choices,r);

  const options =
    shuffle([
      answer,
      ...choices
        .filter(x=>x!==answer)
        .sort(()=>r()-.5)
        .slice(0,3)
    ],r);

  const templates = [
    "Pick the secret choice.",
    "Which one did the app select?",
    "Can you guess the selected item?",
    "Which choice is hiding as the answer?",
    "Find the app's choice.",
    "What did the randomizer pick?"
  ];

  return {
    e:"🎯",
    t:"Quick Choice",
    q:pick(templates,r),
    o:options,
    a:options.indexOf(answer)
  };

}


/* =========================================================
   CREATE CARD
   ========================================================= */

function makeCard(id){

  const d =
    question(id);


  /*
    A complete fingerprint includes:
    type + question + every answer.

    This means an accidental duplicate gets rejected.
  */

  const fingerprint =
    d.t +
    "|" +
    d.q +
    "|" +
    d.o.join("|");


  if(
    seenChallenges.has(fingerprint)
  ){

    return false;

  }


  seenChallenges.add(
    fingerprint
  );


  const card =
    document.createElement("section");

  card.className =
    "card";


  const inner =
    document.createElement("div");

  inner.className =
    "inner";


  inner.innerHTML = `

    <div class="emoji">
      ${esc(d.e)}
    </div>

    <div class="type">
      ${esc(d.t)}
    </div>

    <div class="title">
      ${esc(d.q)}
    </div>

    <div class="hint">
      Pick an answer.
    </div>

    <div class="options"></div>

    <div class="result"></div>

  `;


  const optionsContainer =
    inner.querySelector(".options");

  const result =
    inner.querySelector(".result");


  let answered =
    false;


  d.o.forEach(
    (optionText,index) => {

      const button =
        document.createElement("button");

      button.className =
        "option";

      button.textContent =
        optionText;


      button.onclick = () => {

        if(answered){
          return;
        }


        answered = true;


        /*
          Disable every option immediately so
          the user cannot answer twice.
        */

        [...optionsContainer.children]
          .forEach(
            b => {
              b.disabled = true;
            }
          );


        /* LOOK AROUND */

        if(d.a === null){

          button.classList.add(
            "selected"
          );

          result.textContent =
            "Nice choice 😎";

          streak++;

        }


        /* CORRECT */

        else if(index === d.a){

          button.classList.add(
            "correct"
          );

          result.textContent =
            "✅ Correct!";

          streak++;

        }


        /* WRONG */

        else{

          button.classList.add(
            "wrong"
          );

          if(
            optionsContainer.children[d.a]
          ){

            optionsContainer
              .children[d.a]
              .classList.add(
                "correct"
              );

          }

          result.textContent =
            "❌ Not quite — keep going!";

          streak = 0;

        }


        streakEl.textContent =
          "🔥 " + streak;

      };


      optionsContainer.appendChild(
        button
      );

    }
  );


  card.appendChild(
    inner
  );


  feed.appendChild(
    card
  );


  return true;

}


/* =========================================================
   LOAD BATCH
   ========================================================= */

function addBatch(){

  if(generated >= TOTAL){
    return;
  }


  let added = 0;


  while(
    added < BATCH_SIZE &&
    generated < TOTAL
  ){

    /*
      Circular ID system.

      This means starting at any random ID still allows
      the app to eventually cover all 1,000,000 IDs.
    */

    const id =
      (
        startId +
        generated
      ) % TOTAL;


    const success =
      makeCard(id);


    generated++;


    if(success){
      added++;
    }

  }


  updateProgress();

}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress(){

  const percent =
    Math.min(
      generated / TOTAL,
      1
    );


  const rail =
    document.getElementById(
      "progressRail"
    );


  const railHeight =
    rail.clientHeight;


  const thumbHeight =
    progressThumb.offsetHeight;


  const usableHeight =
    Math.max(
      0,
      railHeight-thumbHeight
    );


  progressThumb.style.top =
    (
      percent *
      usableHeight
    ) + "px";


  progressText.textContent =
    generated.toLocaleString() +
    " / " +
    TOTAL.toLocaleString();

}


/* =========================================================
   CLEANUP
   ========================================================= */

function cleanupCards(){

  while(
    feed.children.length >
    MAX_DOM_CARDS
  ){

    const first =
      feed.children[0];


    /*
      Only remove cards that are safely behind
      the user's current position.
    */

    if(
      first.getBoundingClientRect().bottom
      >= -1500
    ){

      break;

    }


    const height =
      first.offsetHeight;


    first.remove();


    /*
      Compensate for removing the card so the
      user's scroll position does not jump.
    */

    feed.scrollTop -=
      height;

  }

}


/* =========================================================
   SCROLL
   ========================================================= */

feed.addEventListener(
  "scroll",

  () => {

    const nearBottom =
      feed.scrollTop +
      feed.clientHeight >=
      feed.scrollHeight -
      feed.clientHeight * 5;


    if(
      nearBottom &&
      generated < TOTAL
    ){

      addBatch();

    }


    cleanupCards();

    updateProgress();

  },

  {
    passive:true
  }

);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

addBatch();


/* =========================================================
   KEEP THE FEED FULL
   ========================================================= */

function ensureEnoughCards(){

  if(
    generated < TOTAL &&
    feed.scrollHeight <
    feed.clientHeight * 3
  ){

    addBatch();

  }

}


setInterval(
  ensureEnoughCards,
  1000
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",

  () => {

    ensureEnoughCards();

    updateProgress();

  }
);


/* =========================================================
   FINISHED
   ========================================================= */

window.addEventListener(
  "load",

  () => {

    updateProgress();

  }
);

</script>
