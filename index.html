<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipe Break">
<title>Swipe Break</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100%;
  overflow:hidden
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom)
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-weight:800
}

#feed{
  height:calc(100% - 58px);
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.card{
  height:100%;
  min-height:520px;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px
}

.inner{
  width:min(520px,100%);
  background:#171717;
  border:1px solid #2b2b2b;
  border-radius:28px;
  padding:30px 22px;
  text-align:center
}

.emoji{
  font-size:64px
}

.type{
  font-size:13px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:1.2px;
  margin-top:12px
}

.title{
  font-size:28px;
  font-weight:850;
  line-height:1.12;
  margin-top:10px
}

.hint{
  color:#aaa;
  margin:10px 0 18px;
  line-height:1.4
}

.options{
  display:grid;
  gap:10px
}

.option{
  width:100%;
  padding:14px;
  border-radius:15px;
  border:1px solid #333;
  background:#222;
  color:#fff;
  font-size:16px;
  font-weight:700
}

.option.selected{
  outline:2px solid #fff;
  background:#303030
}

.result{
  min-height:22px;
  margin-top:12px;
  font-weight:700
}

.counter{
  font-size:12px;
  color:#777;
  margin-top:4px
}

.swipe{
  position:fixed;
  bottom:12px;
  left:0;
  right:0;
  text-align:center;
  color:#777;
  font-size:12px;
  pointer-events:none
}
</style>
</head>

<body>

<header>
  <div>
    <div>Swipe Break</div>
 
  </div>

  <div id="streak">🔥 0</div>
</header>

<div id="feed"></div>

<div class="swipe">↑ swipe for another challenge</div>

<script>

// ==========================================
// SWIPE BREAK
// 1,000,000 deterministic challenges
// ==========================================

const TOTAL = 1000000;

// Random starting point every time the app opens.
// We then move through every challenge exactly once.
const startId = Math.floor(Math.random() * TOTAL);

let generated = 0;
let streak = 0;

const feed = document.getElementById("feed");
const streakEl = document.getElementById("streak");
const countEl = document.getElementById("count");


// Escape text safely
const esc = s =>
  s.replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


// Deterministic random generator
const rng = seed => {
  let x = (seed + 0x6D2B79F5) >>> 0;

  return () => {
    x = Math.imul(x ^ x >>> 15, 1 | x);
    x ^= x + Math.imul(x ^ x >>> 7, 61 | x);

    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
};


const pick = (array, random) =>
  array[Math.floor(random() * array.length)];


const shuffle = (array, random) => {
  array = [...array];

  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
};


// ==========================================
// DATA
// ==========================================

const colors = [
  "red","blue","green","yellow","orange","purple",
  "black","white","pink","brown","gray","silver"
];

const animals = [
  "cat","dog","penguin","frog","turtle","rabbit",
  "panda","koala","lion","tiger","elephant","giraffe",
  "zebra","fox","wolf","bear","otter","dolphin",
  "octopus","shark"
];

const foods = [
  "pizza","burger","apple","banana","popcorn",
  "taco","cookie","donut","ice cream","watermelon",
  "pancake","sandwich","hot dog","strawberry","pretzel"
];

const countries = [
  "Canada","Brazil","Japan","Italy","France","Mexico",
  "Australia","India","Egypt","Greece","Spain","Germany",
  "Norway","Kenya","Chile","Peru","China","South Korea",
  "Ireland","New Zealand"
];

const games = [
  "Minecraft","Roblox","Fortnite","Terraria","Mario Kart",
  "Rocket League","Pokémon","Among Us","Super Mario Bros.",
  "The Legend of Zelda","Geometry Dash","Fall Guys"
];

const emojis = [
  "🍎","🐸","⭐","🚗","🍕","🎮","🦖","🚀",
  "🌎","⚡","🎈","🍪","🐙","🏀","🎲"
];

const words = [
  "APPLE","ROBOT","GAMER","PLANET","CASTLE","BANANA",
  "TIGER","PUZZLE","COMPUTER","DRAGON","MANGO","ROCKET"
];


// ==========================================
// QUESTION GENERATOR
// ==========================================

function question(id){

  const r = rng(id);
  const type = id % 12;


  // Math
  if(type === 0){

    const n = 2 + Math.floor(r() * 48);
    const mult = 2 + Math.floor(r() * 9);

    const ans = n * mult;

    const opts = shuffle([
      ans,
      ans + mult,
      ans - mult,
      ans + 2 * mult
    ], r);

    return {
      e:"🔢",
      t:"Fast Math",
      q:`What is ${n} × ${mult}?`,
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // Addition
  if(type === 1){

    const n = 5 + Math.floor(r() * 95);
    const add = 5 + Math.floor(r() * 95);

    const ans = n + add;

    const opts = shuffle([
      ans,
      ans + 1,
      ans - 1,
      ans + 10
    ], r);

    return {
      e:"➕",
      t:"Number Puzzle",
      q:`What is ${n} + ${add}?`,
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // Subtraction
  if(type === 2){

    const n = 20 + Math.floor(r() * 80);
    const sub = 2 + Math.floor(r() * 18);

    const ans = n - sub;

    const opts = shuffle([
      ans,
      ans + sub,
      ans - 1,
      ans + 10
    ], r);

    return {
      e:"➖",
      t:"Number Puzzle",
      q:`What is ${n} − ${sub}?`,
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // Multiplication
  if(type === 3){

    const a = 2 + Math.floor(r() * 20);
    const b = 2 + Math.floor(r() * 20);

    const ans = a * b;

    const opts = shuffle([
      ans,
      ans + a,
      ans - b,
      ans + 10
    ], r);

    return {
      e:"✖️",
      t:"Math",
      q:`What is ${a} × ${b}?`,
      o:opts.map(String),
      a:opts.indexOf(ans)
    };
  }


  // Look around
  if(type === 4){

    const color = pick(colors, r);

    const opts = shuffle([
      color,
      "something else",
      "nothing",
      "two colors"
    ], r);

    return {
      e:"👀",
      t:"Look Around",
      q:`Look around. Can you find something ${color}?`,
      o:opts,
      a:null
    };
  }


  // Animals
  if(type === 5){

    const animal = pick(animals, r);

    const others = shuffle(
      animals.filter(x => x !== animal),
      r
    ).slice(0,3);

    const opts = shuffle(
      [animal, ...others],
      r
    );

    return {
      e:"🐾",
      t:"Animals",
      q:"Which of these is an animal?",
      o:opts,
      a:opts.indexOf(animal)
    };
  }


  // Food
  if(type === 6){

    const food = pick(foods, r);

    const others = shuffle(
      foods.filter(x => x !== food),
      r
    ).slice(0,3);

    const opts = shuffle(
      [food, ...others],
      r
    );

    return {
      e:"🍿",
      t:"Food",
      q:`Which one is ${food}?`,
      o:opts,
      a:opts.indexOf(food)
    };
  }


  // Geography
  if(type === 7){

    const country = pick(countries, r);

    const opts = shuffle([
      country,
      ...shuffle(
        countries.filter(x => x !== country),
        r
      ).slice(0,3)
    ], r);

    return {
      e:"🌎",
      t:"Geography",
      q:"Which option is a country?",
      o:opts,
      a:opts.indexOf(country)
    };
  }


  // Gaming
  if(type === 8){

    const game = pick(games, r);

    const opts = shuffle([
      game,
      ...shuffle(
        games.filter(x => x !== game),
        r
      ).slice(0,3)
    ], r);

    return {
      e:"🎮",
      t:"Gaming",
      q:"Which game is real?",
      o:opts,
      a:opts.indexOf(game)
    };
  }


  // Memory
  if(type === 9){

    const seq = [
      pick(emojis,r),
      pick(emojis,r),
      pick(emojis,r)
    ];

    const target = seq[1];

    const wrong = emojis.filter(x => x !== target);

    const opts = shuffle([
      target,
      pick(wrong,r),
      pick(wrong,r),
      pick(wrong,r)
    ], r);

    return {
      e:"🧠",
      t:"Memory",
      q:`Remember: ${seq.join(" ")}. Which emoji was second?`,
      o:opts,
      a:opts.indexOf(target)
    };
  }


  // Word
  if(type === 10){

    const word = pick(words, r);

    const scrambled = shuffle([...word], r).join("");

    const wrong = words.filter(x => x !== word);

    const opts = shuffle([
      word,
      pick(wrong,r),
      pick(wrong,r),
      pick(wrong,r)
    ], r);

    return {
      e:"🔤",
      t:"Word Puzzle",
      q:`Unscramble: ${scrambled}`,
      o:opts,
      a:opts.indexOf(word)
    };
  }


  // Random number
  const target = 1 + Math.floor(r() * 10);

  const opts = shuffle([
    String(target),
    String((target % 10) + 1),
    String(Math.max(1,target - 1)),
    String(((target + 4) % 10) + 1)
  ], r);

  return {
    e:"🎲",
    t:"Prediction",
    q:"Pick a number from 1–10. Which number did the app secretly choose?",
    o:opts,
    a:opts.indexOf(String(target))
  };
}


// ==========================================
// CREATE A CARD
// ==========================================

function makeCard(id){

  const d = question(id);

  const card = document.createElement("section");
  card.className = "card";

  const inner = document.createElement("div");
  inner.className = "inner";

  inner.innerHTML = `
    <div class="emoji">${d.e}</div>
    <div class="type">${d.t}</div>
    <div class="title">${esc(d.q)}</div>
    <div class="hint">Pick an answer.</div>
    <div class="options"></div>
    <div class="result"></div>
  `;

  const opts = inner.querySelector(".options");
  const result = inner.querySelector(".result");


  d.o.forEach((x,i) => {

    const b = document.createElement("button");

    b.className = "option";
    b.textContent = x;

    b.onclick = () => {

      [...opts.children].forEach(v =>
        v.classList.remove("selected")
      );

      b.classList.add("selected");


      if(d.a === null || i === d.a){

        result.textContent =
          d.a === null
            ? "Nice choice 😎"
            : "✅ Correct!";

        streak++;

        streakEl.textContent = "🔥 " + streak;

      }else{

        result.textContent =
          "❌ Not quite — keep going!";

      }
    };

    opts.appendChild(b);
  });


  card.appendChild(inner);
  feed.appendChild(card);
}


// ==========================================
// LOAD MORE CHALLENGES
// ==========================================

function addBatch(){

  const BATCH_SIZE = 1000;

  for(
    let i = 0;
    i < BATCH_SIZE && generated < TOTAL;
    i++
  ){

    // Wrap around so a random starting point
    // can still visit all 1,000,000 challenges.
    const id = (startId + generated) % TOTAL;

    makeCard(id);

    generated++;
  }


 
}


// ==========================================
// INITIAL LOAD
// ==========================================

addBatch();


// ==========================================
// CONTINUOUS SCROLLING
// ==========================================

feed.addEventListener(
  "scroll",
  () => {

    // When the user gets within 5 screens
    // of the bottom, load another 50.
    const nearBottom =
      feed.scrollTop + feed.clientHeight >=
      feed.scrollHeight - (feed.clientHeight * 5);

    if(nearBottom && generated < TOTAL){
      addBatch();
    }

  },
  {passive:true}
);


// ==========================================
// EXTRA SAFETY NET
// ==========================================

// If the page gets resized or the browser
// changes its viewport, make sure there is
// always enough content.

window.addEventListener("resize", () => {

  if(
    feed.scrollHeight <=
    feed.clientHeight * 3 &&
    generated < TOTAL
  ){
    addBatch();
  }

});

</script>

</body>
</html>
