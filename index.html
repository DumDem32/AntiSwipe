/* =========================================================
   RANDOMIZER
========================================================= */

function rng(seed){

  let x =
    (seed + 0x6D2B79F5) >>> 0;

  return function(){

    x =
      Math.imul(
        x ^ (x >>> 15),
        1 | x
      );

    x ^=
      x +
      Math.imul(
        x ^ (x >>> 7),
        61 | x
      );

    return (
      (x ^ (x >>> 14)) >>> 0
    ) / 4294967296;

  };
}


function pick(arr,r){
  return arr[Math.floor(r()*arr.length)];
}


function shuffle(arr,r){

  const result = [...arr];

  for(let i=result.length-1;i>0;i--){

    const j =
      Math.floor(r()*(i+1));

    [result[i],result[j]] =
    [result[j],result[i]];
  }

  return result;
}


function esc(s){

  return String(s).replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}


function numberChoices(answer,r,spread=10){

  const values = new Set();

  values.add(answer);

  while(values.size < 4){

    let n =
      answer +
      Math.floor(
        r()*(spread*2+1)
      ) -
      spread;

    if(n !== answer && n >= 0){
      values.add(n);
    }
  }

  return shuffle([...values],r);
}

function question(id){

  const r = rng(id);

  const type =
    id % 30;


  /* -------------------------------------------------------
     0. ADDITION
  ------------------------------------------------------- */

  if(type === 0){

    const a =
      10 + Math.floor(r()*990);

    const b =
      10 + Math.floor(r()*990);

    const answer = a+b;

    const options =
      numberChoices(
        answer,
        r,
        25
      );

    return {
      e:"➕",
      t:"Math",
      q:`What is ${a} + ${b}?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };
  }


  /* -------------------------------------------------------
     1. SUBTRACTION
  ------------------------------------------------------- */

  if(type === 1){

    const a =
      100 + Math.floor(r()*900);

    const b =
      1 + Math.floor(r()*a);

    const answer =
      a-b;

    const options =
      numberChoices(
        answer,
        r,
        25
      );

    return {
      e:"➖",
      t:"Math",
      q:`What is ${a} − ${b}?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };
  }

     2. MULTIPLICATION
  ------------------------------------------------------- */

      2 + Math.floor(r()*30);

    const b =
      2 + Math.floor(r()*30);

    const answer =
      a*b;

    const options =
      numberChoices(
        answer,
        r,
        Math.max(5,Math.floor(answer*.12))
      );

    return {
      e:"✖️",
      t:"Math",
      q:`What is ${a} × ${b}?`,
      o:options.map(String),
      a:options.indexOf(answer)

      b*answer;

      numberChoices(

      t:"Math",
      q:`What is ${a} ÷ ${b}?`,

    ];

    const pair =
      pick(pairs,r);

    const answer =
      pair[1];

    const otherWords =
      pairs
        .flat()
        .filter(x=>x!==pair[0] && x!==answer);

    const options =
      shuffle([
        answer,
        ...otherWords
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:"↔️",
      t:"Words",
      q:`What is the opposite of "${pair[0]}"?`,
      o:options,
      a:options.indexOf(answer)
    };
  }


  /* -------------------------------------------------------
     23. EMOJI
  ------------------------------------------------------- */

  if(type === 23){

    const chosen =
      pick(emojis,r);

    const answer =
      chosen[1];

    const options =
      shuffle([
        answer,
        ...emojis
          .map(x=>x[1])
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:chosen[0],
      t:"Emoji",
      q:`What does ${chosen[0]} represent?`,
      o:options,
      a:options.indexOf(answer)
    };
  }


  /* -------------------------------------------------------
     24. MEMORY
  ------------------------------------------------------- */

  if(type === 24){

    const length =
      3 + Math.floor(r()*3);

    const sequence = [];

    for(let i=0;i<length;i++){
      sequence.push(
        pick(emojis,r)
      );
    }

    const index =
      Math.floor(r()*length);

    const answer =
      sequence[index][0];

    const options =
      shuffle([
        answer,
        ...emojis
          .map(x=>x[0])
          .filter(x=>x!==answer)
          .sort(()=>r()-.5)
          .slice(0,3)
      ],r);

    return {
      e:"🧠",
      t:"Memory",
      q:
        `Remember ${sequence.map(x=>x[0]).join(" ")}. ` +
        `Which emoji was #${index+1}?`,
      o:options,
      a:options.indexOf(answer)
    };
  }


  /* -------------------------------------------------------
     25. LOOK AROUND — COLOR
  ------------------------------------------------------- */

  if(type === 25){

    const color =
      pick(colors,r);

    return {
      e:"👀",
      t:"Look Around",
      q:`Look around. Can you find something ${color}?`,
      o:[
        "I found one",
        "I don't see one",
        "Maybe",
        "Not sure"
      ],
      a:null
    };
  }


  /* -------------------------------------------------------
     26. LOOK AROUND — OBJECT
  ------------------------------------------------------- */

  if(type === 26){

    const object =
      pick(objects,r);

    return {
      e:"👀",
      t:"Look Around",
      q:`Look around. Can you spot a ${object}?`,
      o:[
        "Yes",
        "No",
        "Maybe",
        "Not sure"
      ],
      a:null
    };
  }


  /* -------------------------------------------------------
     27. ESTIMATION
  ------------------------------------------------------- */

  if(type === 27){

    const a =
      10 + Math.floor(r()*490);

    const b =
      10 + Math.floor(r()*490);

    const exact =
      a+b;

    const answer =
      Math.round(exact/10)*10;

    const options =
      shuffle([
        answer,
        answer+10,
        answer-10,
        answer+20
      ],r);

    return {
      e:"🎯",
      t:"Estimation",
      q:`About how much is ${a} + ${b}?`,
      o:options.map(String),
      a:options.indexOf(answer)
    };
  }


  /* -------------------------------------------------------
     28. EVEN OR ODD
  ------------------------------------------------------- */

  if(type === 28){

    const number =
      1 + Math.floor(r()*10000);

    const answer =
      number%2===0
        ? "Even"
        : "Odd";

    const options =
      shuffle([
        "Even",
        "Odd"
      ],r);

    return {
      e:"🔢",
      t:"Numbers",
      q:`Is ${number} even or odd?`,
      o:options,
      a:options.indexOf(answer)
    };
  }


  /* -------------------------------------------------------
     29. MULTIPLE CHOICE KNOWLEDGE
  ------------------------------------------------------- */

  const facts = [

    {
      q:"Which animal is known for having a long trunk?",
      a:"Elephant",
      o:["Elephant","Tiger","Rabbit","Penguin"]
    },

    {
      q:"Which planet do we live on?",
      a:"Earth",
      o:["Earth","Mars","Jupiter","Venus"]
    },

    {
      q:"Which shape has three sides?",
      a:"Triangle",
      o:["Triangle","Square","Circle","Rectangle"]
    },

    {
      q:"Which season usually comes after summer?",
      a:"Autumn",
      o:["Autumn","Spring","Winter","Summer"]
    },

    {
      q:"Which animal is famous for black-and-white stripes?",
      a:"Zebra",
      o:["Zebra","Lion","Elephant","Fox"]
    },

    {
      q:"Which food is commonly made from dough and tomato sauce?",
      a:"Pizza",
      o:["Pizza","Salad","Apple","Carrot"]
    },

    {
      q:"Which object is normally used to tell time?",
      a:"Clock",
      o:["Clock","Pencil","Chair","Shoe"]
    },

    {
      q:"Which direction is opposite of left?",
      a:"Right",
      o:["Right","Up","Down","Forward"]
    },

    {
      q:"Which animal can fly?",
      a:"Eagle",
      o:["Eagle","Elephant","Turtle","Horse"]
    },

    {
      q:"Which one is used to write on paper?",
      a:"Pencil",
      o:["Pencil","Spoon","Pillow","Shoe"]
    },

    {
      q:"Which one is a fruit?",
      a:"Apple",
      o:["Apple","Carrot","Potato","Broccoli"]
    },

    {
      q:"Which one is a mode of transportation?",
      a:"Train",
      o:["Train","Table","Book","Lamp"]
    }

  ];

  const fact =
    pick(facts,r);

  return {
    e:"🧩",
    t:"Quick Quiz",
    q:fact.q,
    o:shuffle(fact.o,r),
    a:0
  };

}


/* =========================================================
   IMPORTANT FIX FOR FACT QUESTIONS
========================================================= */

function makeQuestion(id){

  const d =
    question(id);

  /*
    Some questions have their answer stored before
    their options are shuffled. Recalculate the index
    safely using the actual answer text.
  */

  if(d._answer !== undefined){
    d.a =
      d.o.indexOf(d._answer);
  }

  return d;
}


/* =========================================================
   CREATE CARD
========================================================= */

function makeCard(id){

  const d =
    makeQuestion(id);

  const fingerprint =
    d.t +
    "|" +
    d.q +
    "|" +
    d.o.join("|");

  if(seenChallenges.has(fingerprint)){
    return false;
  }

  seenChallenges.add(fingerprint);


  const card =
    document.createElement("section");

  card.className =
    "card";


  const inner =
    document.createElement("div");

  inner.className =
    "inner";


  inner.innerHTML = `

    <div class="emoji">
      ${esc(d.e)}
    </div>

    <div class="type">
      ${esc(d.t)}
    </div>

    <div class="title">
      ${esc(d.q)}
    </div>

    <div class="hint">
      Pick an answer.
    </div>

    <div class="options"></div>

    <div class="result"></div>

  `;


  const options =
    inner.querySelector(".options");

  const result =
    inner.querySelector(".result");


  let answered =
    false;


  d.o.forEach((text,index)=>{

    const button =
      document.createElement("button");

    button.className =
      "option";

    button.textContent =
      text;


    button.onclick = ()=>{

      if(answered){
        return;
      }

      answered = true;


      [...options.children].forEach(
        b => b.disabled = true
      );


      if(d.a === null){

        button.classList.add(
          "selected"
        );

        result.textContent =
          "Nice! 👀";

        streak++;

      }

      else if(index === d.a){

        button.classList.add(
          "correct"
        );

        result.textContent =
          "✅ Correct!";

        streak++;

      }

      else{

        button.classList.add(
          "wrong"
        );

        if(options.children[d.a]){
          options.children[d.a]
            .classList.add("correct");
        }

        result.textContent =
          "❌ Not quite — keep going!";

        streak = 0;

      }


      streakEl.textContent =
        "🔥 " + streak;

    };


    options.appendChild(button);

  });


  card.appendChild(inner);

  feed.appendChild(card);

  return true;
}


/* =========================================================
   LOAD BATCH
========================================================= */

function addBatch(){

  if(generated >= TOTAL){
    return;
  }

  let added = 0;

  while(
    added < BATCH_SIZE &&
    generated < TOTAL
  ){

    const id =
      (startId + generated) % TOTAL;

    if(makeCard(id)){
      added++;
    }

    generated++;
  }

  updateProgress();
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

  const percent =
    Math.min(
      generated/TOTAL,
      1
    );

  const rail =
    document.getElementById(
      "progressRail"
    );

  const usable =
    Math.max(
      0,
      rail.clientHeight -
      progressThumb.offsetHeight
    );

  progressThumb.style.top =
    (percent*usable)+"px";

  progressText.textContent =
    generated.toLocaleString() +
    " / " +
    TOTAL.toLocaleString();
}


/* =========================================================
   CLEANUP
========================================================= */

function cleanupCards(){

  while(
    feed.children.length >
    MAX_DOM_CARDS
  ){

    const first =
      feed.children[0];

    if(
      first.getBoundingClientRect().bottom
      >= -1500
    ){
      break;
    }

    const height =
      first.offsetHeight;

    first.remove();

    feed.scrollTop -= height;
  }
}


/* =========================================================
   SCROLL
========================================================= */

feed.addEventListener(
  "scroll",

  ()=>{
    
    const nearBottom =
      feed.scrollTop +
      feed.clientHeight >=
      feed.scrollHeight -
      feed.clientHeight*5;

    if(
      nearBottom &&
      generated < TOTAL
    ){
      addBatch();
    }

    cleanupCards();
    updateProgress();

  },

  {passive:true}
);


/* =========================================================
   START
========================================================= */

addBatch();


/* =========================================================
   KEEP FEED FULL
========================================================= */

setInterval(()=>{

  if(
    generated < TOTAL &&
    feed.scrollHeight <
    feed.clientHeight*3
  ){
    addBatch();
  }

},1000);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    updateProgress();
  }
);

</script>
