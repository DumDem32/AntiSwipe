<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipe Break">
<title>Swipe Break</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100%;
  overflow:hidden
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom)
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-weight:800;
  position:relative;
  z-index:10
}

#feed{
  height:calc(100% - 58px);
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.card{
  height:100%;
  min-height:520px;
  scroll-snap-align:start;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px
}

.inner{
  width:min(520px,100%);
  background:#171717;
  border:1px solid #2b2b2b;
  border-radius:28px;
  padding:30px 22px;
  text-align:center
}

.emoji{
  font-size:64px
}

.type{
  font-size:13px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:1.2px;
  margin-top:12px
}

.title{
  font-size:28px;
  font-weight:850;
  line-height:1.12;
  margin-top:10px
}

.hint{
  color:#aaa;
  margin:10px 0 18px;
  line-height:1.4
}

.options{
  display:grid;
  gap:10px
}

.option{
  width:100%;
  padding:14px;
  border-radius:15px;
  border:1px solid #333;
  background:#222;
  color:#fff;
  font-size:16px;
  font-weight:700
}

.option.selected{
  outline:2px solid #fff;
  background:#303030
}

.result{
  min-height:22px;
  margin-top:12px;
  font-weight:700
}

.swipe{
  position:fixed;
  bottom:12px;
  left:0;
  right:0;
  text-align:center;
  color:#777;
  font-size:12px;
  pointer-events:none;

</style>
</head>

// ==========================================

const esc = s =>
  String(s).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


const rng = seed => {

  let x = (seed + 0x6D2B79F5) >>> 0;

  return () => {

    x = Math.imul(x ^ x >>> 15, 1 | x);

    x ^= x + Math.imul(
      x ^ x >>> 7,
      61 | x
    );

    return (
      (x ^ x >>> 14) >>> 0
    ) / 4294967296;
  };
};


const pick = (array, random) =>
  array[Math.floor(random() * array.length)];


const shuffle = (array, random) => {

  array = [...array];

  for(let i = array.length - 1; i > 0; i--){

    const j =
      Math.floor(random() * (i + 1));

    [array[i],array[j]] =
      [array[j],array[i]];
  }

  return array;
};


const differentItems = (array, item, count, random) =>
  shuffle(
    array.filter(x => x !== item),
    random
  ).slice(0,count);

// ==========================================
// QUESTION GENERATOR

function question(id){

  const r = rng(id);

  // ========================================

      `Can you work out ${a} × ${b}?`,

      `Work this multiplication problem: ${a} × ${b}`,
      `How much is ${a} groups of ${b}?`,
      `Find the answer: ${a} × ${b}.`,
      `What's ${a} multiplied by ${b}?`,
      `Solve this: ${a} × ${b} = ?`
    ];

    const opts = shuffle([
      ans,
      ans + b,
      ans - b,
      ans + a
    ],r);

    return {

      t:"Fast Math",
      q:pick(templates,r),
      o:opts.map(String),
      a:opts.indexOf(ans)

      t:"Number Puzzle",
      q:pick(templates,r),

  // ========================================
  // 3 — MULTIPLICATION
  // ========================================

    const b = 2 + Math.floor(r() * 50);

    const ans = a * b;

      `Solve: ${a} × ${b}`,
      `Calculate ${a} times ${b}.`,
      `Can you solve ${a} × ${b}?`,

    const country = pick(countries,r);

    const others = differentItems(

      r
    );

    const opts = shuffle(
      [country,...others],

    const templates = [

      `Which choice names a country?`,
      `Find the country.`,
      `Which place is an independent country?`,
      `Can you identify the country?`,
      `Which option belongs on a world map as a country?`,

      `Spot the country.`,
      `Which one is a nation?`,
      `Which place is a country rather than a city?`,
      `Find the nation in this list.`,
      `Which choice is a real country?`,
      `Can you pick out the country?`,
      `Which option names a nation?`,
      `Which place belongs to the list of countries?`
    ];

    return {
      e:"🌎",
      t:"Geography",
      q:pick(templates,r),
      o:opts,
      a:opts.indexOf(country)
    };
  }


  // ========================================
  // 8 — GAMING
  // ========================================

  if(type === 8){

    const game = pick(games,r);

    const others = differentItems(
      games,
      game,
      3,
      r
    );

    const opts = shuffle(
      [game,...others],

    );

    const templates = [

      `Which one can you play?`,

  // ========================================

  // ========================================

  if(type === 9){

    const sequenceLength =
      3 + Math.floor(r() * 3);

    const seq = [];

    for(let i=0;i<sequenceLength;i++){
      seq.push(pick(emojis,r));
    }

    const targetIndex =
      Math.floor(r() * sequenceLength);

    const target = seq[targetIndex];

    const wrong = differentItems(

    const opts = shuffle(

    }while(

    );

  // ========================================

  const max =

  const opts = shuffle([
    target,

    Math.min(max,target + 1),
    Math.max(1,target - 10)
  ].map(String),r);

  const templates = [

  return {

    o:opts,
    a:opts.indexOf(String(target))

}


// ==========================================
// CREATE CARD
// ==========================================

function makeCard(id){

  const d = question(id);

  const fingerprint =
    d.t + "|" +
    d.q + "|" +
    d.o.join("|");

  // Don't display exact duplicates.
  if(seenChallenges.has(fingerprint)){
    return false;
  }

  seenChallenges.add(fingerprint);

  const card =
    document.createElement("section");

  card.className = "card";

  const inner =
    document.createElement("div");

  inner.className = "inner";

  inner.innerHTML = `
    <div class="emoji">${esc(d.e)}</div>
    <div class="type">${esc(d.t)}</div>
    <div class="title">${esc(d.q)}</div>
    <div class="hint">Pick an answer.</div>
    <div class="options"></div>
    <div class="result"></div>
  `;

  const opts =
    inner.querySelector(".options");

  const result =
    inner.querySelector(".result");


  d.o.forEach((x,i) => {

    const b =
      document.createElement("button");

    b.className = "option";

    b.textContent = x;

    b.onclick = () => {

      [...opts.children].forEach(v =>
        v.classList.remove("selected")
      );

      b.classList.add("selected");


      if(d.a === null || i === d.a){

        result.textContent =
          d.a === null
            ? "Nice choice 😎"
            : "✅ Correct!";

        streak++;

        streakEl.textContent =
          "🔥 " + streak;

      }else{

        result.textContent =
          "❌ Not quite — keep going!";

        streak = 0;

        streakEl.textContent =
          "🔥 0";
      }
    };

    opts.appendChild(b);
  });


  card.appendChild(inner);

  feed.appendChild(card);

  return true;
}

// LOAD BATCH
// ==========================================

function addBatch(){

  const BATCH_SIZE = 1000;

  let added = 0;

  while(
    added < BATCH_SIZE &&
    generated < TOTAL
  ){

    const id =
      (startId + generated) % TOTAL;

    const wasAdded =
      makeCard(id);

    generated++;

    if(wasAdded){
      added++;
    }
  }
}


// ==========================================
// INITIAL LOAD
// ==========================================

addBatch();


// ==========================================
// CONTINUOUS SCROLLING
// ==========================================

feed.addEventListener(
  "scroll",
  () => {

    const nearBottom =
      feed.scrollTop +
      feed.clientHeight >=
      feed.scrollHeight -
      (feed.clientHeight * 5);

    if(
      nearBottom &&
      generated < TOTAL
    ){
      addBatch();
    }


    // Remove old cards that are far behind.
    // This keeps the app fast even after
    // scrolling through huge numbers of cards.

    const cards =
      feed.children;

    while(
      cards.length > 100 &&
      cards[0].getBoundingClientRect().bottom < -2000
    ){
      cards[0].remove();
    }

  },
  {passive:true}
);


// ==========================================
// RESIZE SAFETY
// ==========================================

window.addEventListener(
  "resize",
  () => {

    if(
      feed.scrollHeight <=
      feed.clientHeight * 3 &&
      generated < TOTAL
    ){
      addBatch();
    }

  }
);

</script>
